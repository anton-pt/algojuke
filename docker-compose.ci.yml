# Minimal Docker Compose for CI integration tests
# Only includes PostgreSQL and Qdrant (core dependencies)
# Excludes: Langfuse (complex), TEI (slow model download), Inngest (not needed for tests)

services:
  postgres:
    image: postgres:15-alpine
    container_name: algojuke-postgres-ci
    environment:
      POSTGRES_DB: algojuke_test
      POSTGRES_USER: algojuke_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algojuke_user -d algojuke_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: algojuke-qdrant-ci
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6333/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
