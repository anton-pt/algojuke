apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: algojuke-worker
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3001
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: latest
            - name: MUSIXMATCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: musixmatch-api-key
                  key: latest
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elevenlabs-api-key
                  key: latest
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret-key
                  key: latest
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-public-key
                  key: latest
            - name: INNGEST_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: inngest-signing-key
                  key: latest
            - name: INNGEST_EVENT_KEY
              valueFrom:
                secretKeyRef:
                  name: inngest-event-key
                  key: latest
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: qdrant-url
                  key: latest
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: latest
            # Gemini embedding configuration
            - name: EMBEDDING_PROVIDER
              value: gemini
            - name: EMBEDDING_DIMENSIONS
              value: "3072"
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: gcp-project-id
                  key: latest
            - name: GOOGLE_CLOUD_REGION
              value: europe-west4
            # Backend API access for agent tools (ALG-77)
            - name: BACKEND_API_URL
              valueFrom:
                secretKeyRef:
                  name: backend-api-url
                  key: latest
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: algojuke-service-api-key
                  key: latest
            # GCS Audio Storage (ALG-80)
            - name: GCS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: gcp-project-id
                  key: latest
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: gcs-bucket-name
                  key: latest
